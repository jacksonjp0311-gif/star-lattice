name: Refresh star lattice

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_star_lattice.py"
      - "lattice.config.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: star-lattice-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh metrics and SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_star_lattice.py
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/star-metrics.json site/star-lattice.svg site/star-lattice.fingerprint
          if git diff --staged --quiet; then
            echo "No metric changes."
          else
            git commit -m "chore: refresh star lattice metrics"
            git push
          fi
